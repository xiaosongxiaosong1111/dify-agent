<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),icon=(n,small=false)=>`<svg class="icon ${small?'small':''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const STORAGE='flowcraft-prototype-v1';
let store={active:'support',providers:[{id:'p1',name:'DeepSeek 演示配置',provider:'DeepSeek',model:'示例模型 A',role:'主 Agent',url:'https://api.deepseek.com'},{id:'p2',name:'轻量任务演示配置',provider:'自定义兼容接口',model:'示例模型 B',role:'轻量任务',url:''}],envs:[{id:'e1',name:'公司开发环境',url:'http://localhost',version:'用户指定版本',mock:true},{id:'e2',name:'客户测试环境',url:'https://customer.example',version:'待确认',mock:true}],limits:{retries:3,minutes:10},tasks:[]};
function makeTask(id,name,type,kind){return{id,name,type,kind,env:'e1',req:false,cfg:false,status:'draft',runStep:0,version:1,feedback:[],files:[],messages:[],versions:[],requirements:kind==='contract'?{goal:'帮助业务同事快速识别合同中的风险条款',input:'单份 PDF / Word 合同，文件必须可读取',output:'按条款列出风险、依据和建议，输出结构化报告',rules:'检查付款、违约、保密条款；不替代最终人工审阅',knowledge:'合同审查规则库；资料缺失时明确标注',fallback:'解析失败提示重新上传；依据不足交由人工确认'}:{goal:'为客户提供产品与售后问答，减少重复咨询',input:'用户问题；查询订单时需要订单号',output:'中文回复、资料来源；必要时追问或引导人工',rules:'优先使用指定资料；缺少订单号时先追问',knowledge:'产品资料库 + 售后政策库；复用资源，订单接口暂用模拟',fallback:'检索无结果时不编造；说明无法确认并提供后续渠道'}};}
let a=makeTask('support','客户售后问答助手','Chatflow','support');a.messages=[{role:'user',text:'帮我做一个客户售后问答助手。根据产品资料和售后政策回答问题，缺少订单号时先追问。订单接口还没准备好，可以先用模拟数据。'},{role:'assistant',text:'我已整理出搭建方案：检索产品与售后资料，判断问题是否需要查询订单，再生成有依据的回答。\n\n订单查询将使用模拟数据，最终交付中会列出替换步骤。你选择的应用类型是 Chatflow。',card:'requirements'}];
let b=makeTask('contract','合同风险提取流程','Workflow','contract');b.req=true;b.messages=[{role:'user',text:'我选择 Workflow。上传合同后，提取付款、违约和保密条款，生成风险报告。'},{role:'assistant',text:'需求已经确认。请查看右侧具体配置与资源操作，确认后可以体验模拟生成和试跑。',card:'config'}];
let c=makeTask('batch','批量工单分类','Workflow','batch');c.req=true;c.cfg=true;c.status='complete';c.runStep=6;c.messages=[{role:'user',text:'批量处理工单，分类为物流、退款和其他问题。单条失败时继续处理其他工单，最后汇总失败项。'},{role:'assistant',text:'这个示例任务展示已完成状态：主流程和关键分支的模拟样例已通过。所有结果均为原型演示，未连接真实 Dify。',card:'delivery'}];c.requirements={goal:'批量分类客户工单并汇总处理结果',input:'工单列表，单条包含编号和问题描述',output:'分类结果列表 + 失败项清单',rules:'物流 / 退款 / 其他；单条失败继续处理其余工单',knowledge:'无需知识库；仅使用分类规则',fallback:'空内容记入失败项，不中断整批任务'};c.versions=[{v:1,label:'初始方案',at:'演示版本'}];store.tasks=[a,b,c];
try{const saved=JSON.parse(localStorage.getItem(STORAGE));if(saved&&Array.isArray(saved.tasks)&&saved.tasks.length){store=saved;store.tasks.forEach(t=>{if(t.status==='running')t.status='paused';});}}catch(e){}
let activeTab='requirements',timer=null,toastTimer=null,selectedType='',settingPage='models',lastFocus=null,chosenNode='start',providerTested=false;
const task=()=>store.tasks.find(t=>t.id===store.active)||store.tasks[0];
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(store));$('#savedLabel').textContent='进度已保存';}catch(e){$('#savedLabel').textContent='本次进度未持久保存';}}
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3300);}
function stage(t){return t.status==='complete'?3:t.cfg?2:t.req?1:0;}
function statusName(t){return t.status==='complete'?'模拟试跑完成':t.status==='running'?'模拟执行中':t.status==='paused'?'已暂停，可继续':t.cfg?'等待试跑':t.req?'待确认配置':'待确认需求';}
function render(){const t=task();$('#taskTitle').textContent=t.name;$('#appType').textContent=t.type;$('#versionLabel').textContent=`${t.status==='complete'?'成果':'草稿'} v0.${t.version}`;$('#taskList').innerHTML=store.tasks.map(x=>`<button class="task-item ${x.id===t.id?'active':''}" data-task="${esc(x.id)}">${icon(x.type==='Chatflow'?'chat':'flow',true)}<div><strong>${esc(x.name)}</strong><small>${esc(x.type)} · ${statusName(x)}</small></div></button>`).join('');$('#steps').innerHTML=['梳理需求','确认方案','生成与试跑','交付成果'].map((s,i)=>`${i?'<span class="connector"></span>':''}<div class="step ${i===stage(t)?'active':i<stage(t)?'done':''}"><span class="stepnum">${i<stage(t)?'✓':i+1}</span>${s}</div>`).join('');$('#chatModel').textContent=(store.providers.find(p=>p.role==='主 Agent')?.name||'请设置主模型');document.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('active',x.dataset.tab===activeTab);x.setAttribute('aria-selected',x.dataset.tab===activeTab);});renderMessages();renderPanel();renderFiles();}
function renderMessages(){const t=task();$('#messages').innerHTML='<p class="day">当前任务 · 进度保存在本机浏览器</p>'+t.messages.map(m=>`<article class="message ${m.role}"><div class="msg-avatar">${m.role==='user'?'ME':icon('flow',true)}</div><div class="msg-body"><div class="msg-name">${m.role==='user'?'你':'Sierra'}<span>${m.role==='assistant'?'Dify 搭建助手 · 模拟回复':''}</span></div><div class="bubble">${esc(m.text).split('\n').map(p=>p?`<p>${p}</p>`:'').join('')}</div>${m.card?messageCard(m.card):''}</div></article>`).join('');$('#messages').scrollTop=$('#messages').scrollHeight;}
function messageCard(kind){const map={requirements:['搭建说明单已整理','目标、输入输出、业务规则和验收样例已整理。请确认后继续。','查看并确认需求','viewreq'],config:['具体配置待确认','查看模型参数、知识库选择及资源操作，再决定是否开始搭建。','查看配置方案','viewconfig'],run:['模拟执行已开始','可以在工作台查看执行过程，或暂停后继续。','查看试跑进度','viewrun'],delivery:['阶段性成果已准备','主流程的模拟样例已通过，真实环境仍待连接验证。','查看交付内容','viewdelivery']};const v=map[kind]||map.requirements;return`<div class="insight"><div class="insight-head">${icon('doc',true)}${v[0]}</div><p>${v[1]}</p><button class="primary" data-action="${v[3]}">${v[2]} →</button></div>`;}
function renderFiles(){const t=task();$('#attachments').innerHTML=t.files.map((f,i)=>`<span class="tag">${icon('doc',true)}${esc(f.name)}<button data-remove-file="${i}" aria-label="移除附件">×</button></span>`).join('');}
function checkRow(label,val){const pending=!val||/^待补充/.test(val);return`<div class="check-row"><span class="check-icon" ${pending?'style="background:#fff2df;color:#b18a49"':''}>${pending?'?':'✓'}</span><div class="check-content"><strong>${label}</strong><p>${esc(val)}</p></div><button class="edit-icon" data-action="editreq" aria-label="编辑需求">${icon('edit',true)}</button></div>`;}
function renderPanel(){const t=task();let out='';if(activeTab==='requirements'){out=`<div class="card"><div class="card-heading"><strong>搭建准备度</strong><span class="pill ${t.req?'green':'purple'}">${t.req?'已确认':'等待你的确认'}</span></div><div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:#8890a3">必要信息已明确</span><strong style="color:var(--brand)">8 / 8</strong></div><div class="progress-track"><div class="progress-fill" style="width:100%"></div></div><p class="subtext">这是预填好的示例需求。新任务需补齐关键字段，并确认具体内容后才能开始搭建。</p></div><div class="card"><div class="card-heading"><strong>搭建说明单</strong><button class="edit-icon" data-action="editreq">${icon('edit',true)} 编辑</button></div>${checkRow('业务目标',t.requirements.goal)}${checkRow('输入',t.requirements.input)}${checkRow('期望输出',t.requirements.output)}${checkRow('关键业务规则',t.requirements.rules)}${checkRow('资料与外部依赖',t.requirements.knowledge)}${checkRow('异常行为',t.requirements.fallback)}${checkRow('应用类型与环境',`${t.type} · ${store.envs.find(e=>e.id===t.env)?.name||'待选择'}（演示环境）`)}${checkRow('试跑样例','正常输入、信息不足、资料无答案 / 单条失败')}${t.feedback.length?checkRow('本轮新增要求',t.feedback.join('；')):''}</div><div class="callout">${icon('shield',true)}<span>资源缺失可以采用确认过的模拟方案。真实导入与运行状态，将在正式接入后验证。</span></div><button class="primary panel-action" data-action="confirmreq">${icon('check',true)}${t.req?'查看已确认的配置方案':'确认需求，查看配置方案'}</button><button class="panel-secondary" data-action="editreq">先调整需求</button>`;}else if(activeTab==='config'){out=`<div class="callout ${t.req?'':'amber'}" style="margin-bottom:14px">${icon('shield',true)}<span>${t.req?'请集中检查具体配置和资源操作。示例模型名称与参数用于展示，未验证供应商能力。':'需求尚未确认。可以先看方案，确认需求后才能批准配置和开始搭建。'}</span></div><div class="card"><div class="card-heading"><strong>节点配置方案</strong><button class="edit-icon" data-action="editconfig">${icon('edit',true)} 调整</button></div><div class="config-node"><div class="node-label"><span class="nodeicon">${icon('spark',true)}</span>${t.kind==='batch'?'问题分类':'回答 / 分析生成'}<small>LLM</small></div><div class="kv"><span>供应商 / 模型</span><span>DeepSeek · ${esc(t.model||'示例模型 A')}</span></div><div class="node-params"><span>Temperature ${esc(t.temperature??'0.2')}</span><span>输出上限 ${esc(t.tokens||'2048')}</span></div><p class="hint">建议理由：优先保持输出稳定；具体参数需按真实模型能力确认。</p></div><div class="config-node"><div class="node-label"><span class="nodeicon" style="background:#eaf6f0;color:#489274">${icon('box',true)}</span>${t.kind==='batch'?'分类规则':'知识检索'}<small>${t.kind==='batch'?'规则':'Retrieval'}</small></div><div class="kv"><span>${t.kind==='batch'?'类别':'知识库'}</span><span>${t.kind==='batch'?'物流 / 退款 / 其他':t.kind==='contract'?'合同审查规则库':'产品资料库 / 售后政策库'}</span></div><div class="node-params"><span>Top K ${esc(t.topk||'3')}</span><span>检索方式：${esc(t.retrieval||'混合检索')}</span></div></div><div class="config-node"><div class="node-label"><span class="nodeicon" style="background:#fff3e9;color:#c09261">${icon('flow',true)}</span>条件判断与代码处理<small>Logic</small></div><p class="hint">${esc(t.requirements.fallback)}；代码与字段检查纳入试跑。</p></div><button class="secondary full" data-action="graph">${icon('flow',true)}查看流程与节点说明</button></div><div class="card"><div class="card-heading"><strong>资源操作清单</strong><span class="pill amber">模拟方案</span></div><div class="kv"><span>目标环境</span><span>${esc(store.envs.find(e=>e.id===t.env)?.name||'演示环境')}</span></div><div class="kv"><span>已有知识库</span><span>${t.kind==='batch'?'无需知识库':'复用，不覆盖'}</span></div><div class="kv"><span>应用</span><span>创建一个新应用</span></div><div class="kv"><span>外部接口</span><span>${t.kind==='support'?'订单查询使用模拟数据':'本例无需外部接口'}</span></div><p class="hint">本原型只演示以上操作，不创建、修改或连接任何真实资源。</p></div><button class="primary panel-action" data-action="confirmconfig" ${!t.req?'disabled':''}>${icon('check',true)}${t.cfg?'配置已确认，开始模拟试跑':'确认配置与资源操作'}</button>`;}else if(activeTab==='run'){out=runPanel(t);}else{out=deliveryPanel(t);}$('#panel').innerHTML=out;}
const runSteps=[['生成流程与示意 DSL','依据确认的需求组装节点与变量'],['检查结构与变量引用','演示发现一个变量引用错误'],['修复并重新检查','修正变量选择器，保留业务规则'],['导入目标环境','模拟导入，无实际 Dify 写入'],['执行验收样例','模拟正常、缺失信息和异常分支'],['整理交付与待办','标明模拟依赖、待验证项和版本']];
function runPanel(t){if(!t.cfg)return`<div class="empty">${icon('play')}<strong>方案确认后，开始试跑</strong><p>先确认需求、具体配置和资源操作。<br>执行记录会在这里持续更新。</p><button class="secondary" data-action="viewconfig">查看配置方案</button></div>`;const done=t.status==='complete';let out=`<div class="callout amber" style="margin-bottom:14px">${icon('play',true)}<span>所有检查、导入、修复和通过结果均为模拟。当前不代表真实 DSL 有效或目标应用可运行。</span></div><div class="card"><div class="card-heading"><strong>${done?'模拟执行结束':t.status==='running'?'正在模拟执行':t.status==='paused'?'任务已暂停':'已准备好执行'}</strong><span class="pill ${done?'green':'purple'}">${t.runStep} / 6</span></div><div class="progress-track"><div class="progress-fill" style="width:${t.runStep/6*100}%"></div></div>${runSteps.map((s,i)=>`<div class="run-row"><span class="run-dot ${i<t.runStep?'':i===t.runStep&&t.status==='running'?'current':'wait'}">${i<t.runStep?'✓':i+1}</span><div class="run-info">${s[0]}${i<t.runStep?'<span class="pill green">模拟完成</span>':''}<small>${s[1]}</small></div></div>`).join('')}<button class="${t.status==='running'?'secondary':'primary'} panel-action" data-action="${t.status==='running'?'pause':'run'}">${icon(t.status==='running'?'pause':'play',true)}${t.status==='running'?'暂停，保存当前进度':done?'重新模拟试跑':t.status==='paused'?'继续模拟执行':'开始模拟生成与试跑'}</button></div>`;if(done)out+=`<div class="stats"><div class="stat"><strong style="color:var(--green)">3 / 3</strong><small>模拟样例通过</small></div><div class="stat"><strong>1</strong><small>模拟修复次数</small></div><div class="stat"><strong>—</strong><small>实际 Token 用量</small></div></div><div class="card"><div class="card-heading"><strong>验收样例</strong><span class="pill green">模拟通过</span></div>${testCases(t).map((x,i)=>`<details class="test-item"><summary><span>${i+1}. ${esc(x[0])}</span><span style="color:var(--green);font-size:10px">模拟通过 ⌄</span></summary><p><strong>输入：</strong>${esc(x[1])}<br><strong>预期：</strong>${esc(x[2])}<br><strong>演示结果：</strong>${esc(x[3])}</p></details>`).join('')}<button class="primary panel-action" data-action="viewdelivery">查看阶段性成果 →</button></div>`;return out;}
function testCases(t){return t.kind==='contract'?[['正常合同','包含付款与违约条款的合同','按字段输出风险与依据','已生成示例风险清单'],['缺失条款','没有保密条款的合同','明确标注缺失，交由人工审阅','已标记缺失条款'],['解析失败','无法读取的文件','提示重新上传，不编造内容','已展示重新上传提示']]:t.kind==='batch'?[['正常分类','物流与退款工单列表','逐条分类并汇总','已展示示例分类列表'],['单条空内容','列表中有一条空工单','记录失败并继续其他条目','示例失败项已汇总'],['未知类别','无法明确归类的问题','归入其他，保留原文','已保留示例原文']]:[['知识问答','这款产品的保修期是多久？','依据指定资料回答，并给出来源','示例回复附上售后政策来源'],['信息不足','我的订单到哪了？','先追问订单号','请提供你的订单号，以便继续查询'],['知识无答案','你们明年会推出什么产品？','明确无法确认，不编造','目前资料中没有该信息，建议联系人工']];}
function deliveryPanel(t){if(t.status!=='complete')return`<div class="empty">${icon('doc')}<strong>交付内容会在试跑后生成</strong><p>包括 DSL、需求与配置说明、测试记录和待办。<br>未验证的部分会明确标注。</p><button class="secondary" data-action="viewrun">查看试跑状态</button></div>`;return`<div class="callout green" style="margin-bottom:14px">${icon('check',true)}<span><strong>模拟试跑完成 · 实际状态：待验证</strong><br>你已体验完整搭建链路。正式交付仍需连接真实 Dify，完成导入和运行验证。</span></div><div class="card"><div class="card-heading"><strong>阶段性成果</strong><span class="pill purple">v0.${t.version}</span></div>${[['YML','示意 DSL','展示文件结构，不可直接导入','yaml'],['MD','需求与配置说明','包含已确认需求、配置及资源计划','report'],['TEST','模拟试跑报告','展示样例、修复和验证边界','tests']].map(x=>`<div class="artifact"><span class="artifact-icon">${x[0]}</span><div><strong>${x[1]}</strong><small>${x[2]}</small></div><button class="icon-button" data-download="${x[3]}" aria-label="下载${x[1]}">${icon('download',true)}</button></div>`).join('')}<button class="secondary full" data-action="previewdsl" style="margin-top:12px">查看示意 DSL</button></div><div class="card"><div class="card-heading"><strong>待接入与调试</strong><span class="pill amber">真实验证待完成</span></div><div class="check-row"><span class="check-icon" style="background:#fff2df;color:#b18a49">1</span><div class="check-content"><p>配置真实模型，验证工具调用与输出能力</p></div></div><div class="check-row"><span class="check-icon" style="background:#fff2df;color:#b18a49">2</span><div class="check-content"><p>连接目标 Dify，完成真实导入和试跑</p></div></div>${t.kind==='support'?'<div class="check-row"><span class="check-icon" style="background:#fff2df;color:#b18a49">3</span><div class="check-content"><p>替换模拟订单接口，重新验证查询分支</p></div></div>':''}</div><div class="card"><div class="card-heading"><strong>版本记录</strong><button class="edit-icon" data-action="upload">导入手动修改版</button></div>${(t.versions.length?t.versions:[{v:t.version,label:'当前示例版本',at:'模拟试跑完成'}]).slice().reverse().map(v=>`<div class="version"><div>v0.${v.v} · ${esc(v.label)}<small>${esc(v.at)}</small></div><button data-restore="${v.v}">恢复</button></div>`).join('')}<p class="hint">恢复为草稿后需要重新确认和试跑。上传 DSL 仅登记参考文件，不会解析或覆盖真实应用。</p></div>`;}
function addMessage(role,text,card){task().messages.push({role,text,card});save();render();}
function confirmReq(){if(task().req){activeTab='config';render();return;}if(Object.values(task().requirements).some(v=>!v||/^待补充/.test(v)))return toast('请先补齐所有关键需求');task().req=true;task().cfg=false;task().status='draft';task().runStep=0;activeTab='config';addMessage('assistant','需求说明已确认。下一步请集中检查具体模型参数、知识库选择和资源操作。确认后开始模拟搭建。','config');toast('需求已确认，等待配置与资源操作确认');}
function confirmConfig(){if(!task().req)return toast('请先确认需求');if(task().cfg){startRun();return;}task().cfg=true;activeTab='run';addMessage('assistant','配置与资源操作已确认。原型将模拟生成、检查、修复、导入与试跑，所有执行都不会连接真实服务。','run');toast('方案已确认，可以开始模拟执行');}
function startRun(){const t=task();if(!t.req||!t.cfg)return toast('请先确认需求和配置');if(timer)return;if(t.status==='complete')t.runStep=0;t.status='running';activeTab='run';save();render();scheduleRun(t.id);}
function scheduleRun(id){timer=setTimeout(()=>{timer=null;const t=store.tasks.find(x=>x.id===id);if(!t||t.status!=='running')return;t.runStep++;if(t.runStep===2)t.messages.push({role:'assistant',text:'模拟检查发现：下游节点引用了错误的变量路径。我会修正字段引用，然后重新检查。业务需求和配置选择不变。'});if(t.runStep>=6){t.status='complete';if(!t.versions.some(v=>v.v===t.version))t.versions.push({v:t.version,label:'需求确认与模拟验证',at:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),snapshot:JSON.parse(JSON.stringify(t.requirements))});t.messages.push({role:'assistant',text:'模拟链路已完成，三个演示样例通过。实际导入与运行仍待验证；你可以查看交付说明，或继续提出修改。',card:'delivery'});if(store.active===id)activeTab='delivery';save();render();toast('模拟执行完成，阶段性成果已准备');return;}save();render();scheduleRun(id);},1200);}
function pauseRun(){clearTimeout(timer);timer=null;if(task().status==='running')task().status='paused';save();render();toast('已暂停，本次执行进度已保留');}
function invalidate(){if(task().status==='running')pauseRun();task().req=false;task().cfg=false;task().status='draft';task().runStep=0;task().version++;activeTab='requirements';}
function send(){const input=$('#messageInput'),text=input.value.trim();if(!text)return;input.value='';const t=task();t.messages.push({role:'user',text});if(/解释|为什么|原因/.test(text)){t.messages.push({role:'assistant',text:'当前示例把业务规则、检索和回答生成分开：先获取依据，再检查信息是否足够，最后组织回复。这样可以分别检查资料来源和异常行为。\n\n这是固定演示回复，尚未调用大模型。你可以在右侧查看并调整方案。'});}else{invalidate();t.feedback.push(text);t.messages.push({role:'assistant',text:'已将这条反馈加入本轮需求说明。请在右侧检查并补充具体规则，再重新确认需求和配置。\n\n原型只演示修改流程，不会自动理解并实现这条反馈；正式版会在这里进一步追问和更新方案。',card:'requirements'});}save();render();}
function showModal(title,desc,body,foot='',wide=false){lastFocus=document.activeElement;$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-head"><div><h2 id="modalTitle">${title}</h2><p>${desc}</p></div><button class="icon-button" data-action="close" aria-label="关闭">${icon('close')}</button></header><div class="modal-body">${body}</div>${foot?`<footer class="modal-foot">${foot}</footer>`:''}</section></div>`;$('#modalRoot').querySelector('button,input,select,textarea')?.focus();}
function closeModal(){$('#modalRoot').innerHTML='';lastFocus?.focus();}
function field(id,label,value='',type='text',hint=''){return`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}">${hint?`<p class="hint">${hint}</p>`:''}</div>`;}
function newModal(){selectedType='';showModal('新建搭建任务','先由你选择应用类型，再开始讨论需求。',`${field('newName','任务名称','','text')}<div class="field"><label>应用类型 · 必须由用户选择</label><div class="choice-grid">${[['Workflow','处理任务并输出结果'],['Chatflow','编排连续对话与追问'],['Agent','模型选择工具完成任务']].map(x=>`<button class="choice" data-type="${x[0]}"><strong>${x[0]}</strong><small>${x[1]}</small></button>`).join('')}</div></div><div class="field"><label for="newEnv">目标 Dify 环境</label><select id="newEnv">${store.envs.map(e=>`<option value="${esc(e.id)}">${esc(e.name)} · 演示</option>`).join('')}</select></div><div class="callout">${icon('chat',true)}<span>创建后可以描述目标、上传参考。助手会追问缺失内容，再集中展示方案供你确认。</span></div>`,`<button class="secondary" data-action="close">取消</button><button class="primary" data-action="createtask">创建任务</button>`);}
function createTask(){const name=$('#newName').value.trim();if(!name||!selectedType)return toast('请填写任务名称并主动选择应用类型');const t=makeTask('t'+Date.now(),name,selectedType,'support');t.env=$('#newEnv').value;t.messages=[{role:'assistant',text:`你已选择 ${selectedType}。请描述这个应用为谁解决什么问题，会收到什么输入，希望得到什么输出。\n\n你也可以上传参考资料。本原型会提供一份可编辑的示例需求表，正式版将在信息不足时持续追问。`}];t.requirements={goal:'待补充',input:'待补充',output:'待补充',rules:'待补充',knowledge:'待补充，可明确为不需要',fallback:'待补充'};store.tasks.unshift(t);store.active=t.id;activeTab='requirements';closeModal();save();render();}
function editReq(){const r=task().requirements;showModal('调整搭建说明单','保存修改后，需要重新确认需求和配置。',Object.entries({goal:'业务目标',input:'输入',output:'期望输出',rules:'关键业务规则',knowledge:'资料与依赖',fallback:'异常行为'}).map(([k,l])=>`<div class="field"><label for="req-${k}">${l}</label><textarea id="req-${k}">${esc(r[k])}</textarea></div>`).join(''),`<button class="secondary" data-action="close">取消</button><button class="primary" data-action="savereq">保存修改</button>`);}
function saveReq(){const r={};for(const k of Object.keys(task().requirements)){const el=$('#req-'+k);if(el)r[k]=el.value.trim();}if(Object.values(r).some(v=>!v))return toast('必要项不能留空；不适用时请明确填写');invalidate();task().requirements=r;closeModal();save();render();toast('需求已更新，请重新确认');}
function editConfig(){const t=task();showModal('调整具体配置','示例配置仅用于原型展示，不会调用模型。',`${field('cfgModel','模型名称',t.model||'示例模型 A')}<div class="field-grid">${field('cfgTemp','Temperature',t.temperature??'0.2','number')}${field('cfgTokens','输出 Token 上限',t.tokens||'2048','number')}</div><div class="field-grid">${field('cfgTopk','检索 Top K',t.topk||'3','number')}<div class="field"><label for="cfgRetrieval">检索方式</label><select id="cfgRetrieval"><option>混合检索</option><option>向量检索</option><option>关键词检索</option></select></div></div><div class="callout amber">配置修改会使原试跑结果失效，需要重新确认并试跑。</div>`,`<button class="secondary" data-action="close">取消</button><button class="primary" data-action="saveconfig">保存配置</button>`);$('#cfgRetrieval').value=t.retrieval||'混合检索';$('#cfgTemp').min='0';$('#cfgTemp').max='2';$('#cfgTemp').step='0.1';$('#cfgTokens').min='1';$('#cfgTopk').min='1';}
function saveConfig(){const model=$('#cfgModel').value.trim(),temp=Number($('#cfgTemp').value),tokens=Number($('#cfgTokens').value),topk=Number($('#cfgTopk').value);if(!model||temp<0||temp>2||!Number.isFinite(temp)||!Number.isInteger(tokens)||tokens<1||!Number.isInteger(topk)||topk<1)return toast('请填写有效的模型名称与数值');if(task().status==='running')pauseRun();Object.assign(task(),{model,temperature:temp,tokens,topk,retrieval:$('#cfgRetrieval').value,cfg:false,status:'draft',runStep:0,version:task().version+1});closeModal();activeTab='config';save();render();toast('配置已更新，需要重新确认');}
function settings(page='models'){settingPage=page;const nav=`<nav class="setting-nav">${[['models','模型接入'],['env','Dify 环境'],['usage','用量与规则']].map(x=>`<button class="${page===x[0]?'active':''}" data-setting="${x[0]}">${x[1]}</button>`).join('')}</nav>`;let body='';if(page==='models'){body=`<div class="card-heading"><strong>模型服务配置</strong><button class="secondary" data-action="addprovider">${icon('plus',true)}添加</button></div>${store.providers.map(p=>`<div class="provider-card"><div class="provider-icon">${esc(p.provider[0])}</div><div><strong>${esc(p.name)}</strong><small>${esc(p.model)} · ${esc(p.role)}</small></div><span class="pill purple">演示</span><button class="icon-button" data-provider="${esc(p.id)}" aria-label="编辑模型服务">${icon('edit',true)}</button></div>`).join('')}<div class="callout" style="margin-top:16px">${icon('shield',true)}<span>这里只管理搭建助手使用的模型。生成应用的模型在任务配置中确认。原型不接收真实 API Key，也不发送请求。</span></div><p class="hint">主 Agent 处理需求和复杂问题；轻量模型处理范围明确的辅助任务。正式版将根据验证结果决定分工。</p>`;}else if(page==='env'){body=`<div class="card-heading"><strong>目标 Dify 环境</strong><button class="secondary" data-action="addenv">${icon('plus',true)}添加</button></div>${store.envs.map(e=>`<div class="provider-card"><div class="provider-icon" style="background:#eaf5ef;color:#4b8b6b">D</div><div><strong>${esc(e.name)}</strong><small>${esc(e.url)} · ${esc(e.version)}</small></div><span class="pill amber">未真实连接</span><button class="icon-button" data-env="${esc(e.id)}" aria-label="编辑环境">${icon('edit',true)}</button></div>`).join('')}<div class="callout amber" style="margin-top:16px">${icon('box',true)}<span>保存环境只登记演示信息。真实连接、资源发现与版本兼容检查将在后台实现。</span></div>`;}else{body=`<div class="card-heading"><strong>默认执行上限</strong><span class="pill">可调整</span></div><div class="field-grid">${field('limitRetries','连续无进展修复次数',store.limits.retries,'number')}${field('limitMinutes','单任务时间上限（分钟）',store.limits.minutes,'number')}</div><button class="secondary" data-action="savelimits">保存演示设置</button><div class="card" style="margin-top:20px"><div class="card-heading"><strong>实际调用用量</strong><span class="pill">暂无调用</span></div><div class="kv"><span>输入 / 输出 Token</span><span>0 / 0</span></div><div class="kv"><span>实际请求次数</span><span>0</span></div><div class="kv"><span>费用估算</span><span>¥ 0.00</span></div><p class="hint">原型未调用模型。正式版会分别记录主模型、轻量模型、重试和缓存用量。</p></div><button class="danger full" data-action="reset">重置原型演示数据</button>`;}showModal('工作空间设置','本机配置 · 所有连接能力均为原型演示',`<div class="setting-layout">${nav}<div>${body}</div></div>`,`<button class="primary" data-action="close">完成</button>`,true);}
function providerForm(id){const p=store.providers.find(x=>x.id===id)||{id:'',name:'',provider:'DeepSeek',url:'https://api.deepseek.com',model:'',role:'主 Agent'};providerTested=false;showModal(id?'编辑模型服务':'添加模型服务','填写服务信息，体验正式版的配置流程。',`<div class="field-grid">${field('pName','配置名称',p.name)}<div class="field"><label for="pProvider">服务商</label><select id="pProvider"><option>DeepSeek</option><option>通义千问</option><option>OpenAI</option><option>Anthropic</option><option>自定义兼容接口</option></select></div></div>${field('pUrl','API 服务地址',p.url)}<div class="field"><label for="pKey">API Key · 演示占位</label><input id="pKey" type="password" value="demo-key-not-real" readonly><p class="hint">正式版在此输入自己的 Key；原型不接收真实凭据。</p></div><div class="field-grid">${field('pModel','模型名称',p.model,'text','可手动填写；真实可用性需要测试。')}<div class="field"><label for="pRole">任务用途</label><select id="pRole"><option>主 Agent</option><option>轻量任务</option><option>图片理解</option></select></div></div><button class="secondary" data-action="testprovider">${icon('play',true)}模拟连接测试</button><div id="pTest" style="margin-top:12px"></div><input type="hidden" id="pId" value="${esc(id||'')}">`,`<button class="secondary" data-action="models">返回</button>${id?`<button class="danger" data-delete-provider="${esc(id)}">删除</button>`:''}<button class="primary" data-action="saveprovider">保存配置</button>`);$('#pProvider').value=p.provider;$('#pRole').value=p.role;}
function saveProvider(){const name=$('#pName').value.trim(),model=$('#pModel').value.trim();if(!name||!model)return toast('请填写配置名称和模型名称');const id=$('#pId').value||'p'+Date.now(),p={id,name,model,provider:$('#pProvider').value,url:$('#pUrl').value.trim(),role:$('#pRole').value};const i=store.providers.findIndex(x=>x.id===id);if(i>=0)store.providers[i]=p;else store.providers.push(p);save();render();settings('models');toast('演示配置已保存，未保存或发送任何 API Key');}
function testProvider(){if(!$('#pModel').value.trim())return toast('先填写模型名称');providerTested=true;$('#pTest').innerHTML='<div class="callout green">✓ 模拟连接测试通过。工具调用、结构化输出和图片能力仍需真实验证；本次没有发出请求。</div>';}
function envForm(id){const e=store.envs.find(x=>x.id===id)||{name:'',url:'',version:''};showModal(id?'编辑 Dify 环境':'添加 Dify 环境','登记目标环境，不会访问该地址。',`${field('eName','环境名称',e.name)}${field('eUrl','Dify 地址',e.url)}${field('eVersion','Dify 版本',e.version)}<div class="field"><label>连接凭据 · 正式版配置</label><input type="password" value="demo-only" readonly><p class="hint">真实认证方式需要结合 Dify 版本和部署环境确定。</p></div><button class="secondary" data-action="testenv">模拟连接检查</button><div id="eTest" style="margin-top:12px"></div><input id="eId" type="hidden" value="${esc(id||'')}">`,`<button class="secondary" data-action="env">返回</button><button class="primary" data-action="saveenv">保存环境</button>`);}
function saveEnv(){const name=$('#eName').value.trim(),url=$('#eUrl').value.trim(),version=$('#eVersion').value.trim();if(!name||!/^https?:\/\//i.test(url))return toast('请填写环境名称与 http(s) 地址');const id=$('#eId').value||'e'+Date.now(),e={id,name,url,version:version||'待确认',mock:true};const i=store.envs.findIndex(x=>x.id===id);if(i>=0)store.envs[i]=e;else store.envs.push(e);save();render();settings('env');toast('演示环境已保存，没有连接真实 Dify');}
function graphModal(){const t=task();const nodes=t.kind==='contract'?[['start','用户输入','合同文件'],['code','文档提取与检查','解析内容，处理不可读文件'],['retrieval','检索审查规则','合同规则库'],['if','检查条款完整性','标记缺失与异常'],['llm','分析风险','示例模型 A'],['end','输出报告','风险、依据和建议']]:t.kind==='batch'?[['start','用户输入','工单列表'],['code','逐条处理','空内容记入失败列表'],['llm','问题分类','物流 / 退款 / 其他'],['if','检查分类结果','异常条目保留原文'],['end','汇总输出','分类结果与失败项']]:[['start','用户输入','接收客户问题'],['retrieval','知识检索','产品资料库 + 售后政策库'],['if','信息是否足够','需要订单号时先追问'],['code','订单工具 / 数据整理','订单查询使用模拟数据'],['llm','回答生成','依据资料，无法确认时引导人工'],['end','回复用户','答案、来源与后续问题']];showModal('流程预览',`${t.type} · 概念示意，尚未构成真实 Dify 画布`,`${t.type==='Agent'?'<div class="callout amber" style="margin-bottom:12px">你选择了 Agent。这里仅展示任务步骤示意，正式版需按 Agent 应用规则生成，不能直接套用 Chatflow 结构。</div>':''}<div class="graph">${nodes.map((n,i)=>`${i?'<div class="graph-edge"></div>':''}<button class="graph-node ${n[0]===chosenNode?'selected':''}" data-node="${n[0]}" data-description="${esc(n[2])}"><span class="nodeicon">${icon(n[0]==='llm'?'spark':n[0]==='retrieval'?'box':'flow',true)}</span><div><strong>${n[1]}</strong><small>${n[2]}</small></div></button>`).join('')}</div><div class="graph-detail" id="nodeDetail">点击节点查看说明。分支、变量与节点字段将在正式生成时验证。</div>`,`<button class="secondary" data-action="previewdsl">查看示意 DSL</button><button class="primary" data-action="close">完成</button>`,true);}
function yamlText(){const t=task();return`# Sierra 前端原型：示意文件，不能直接导入 Dify\n# 尚未连接模型、执行结构校验或真实导入验证\nprototype_only: true\napplication:\n  name: ${JSON.stringify(t.name)}\n  user_selected_type: ${JSON.stringify(t.type)}\n  version: "demo-0.${t.version}"\nrequirements:\n  goal: ${JSON.stringify(t.requirements.goal)}\n  input: ${JSON.stringify(t.requirements.input)}\n  output: ${JSON.stringify(t.requirements.output)}\n  rules: ${JSON.stringify(t.requirements.rules)}\n  dependencies: ${JSON.stringify(t.requirements.knowledge)}\n  fallback: ${JSON.stringify(t.requirements.fallback)}\nvalidation:\n  actual_import: not_tested\n  actual_execution: not_tested\n  demo_cases: ${t.status==='complete'?'passed':'not_run'}\n`;}
function reportText(t){return`# ${t.name} · 原型演示说明\n\n这是交互原型中的示例成果，未调用模型或连接 Dify。示意 YAML 不能直接导入。\n\n## 最终需求\n\n应用类型：${t.type}\n${Object.entries(t.requirements).map(([k,v])=>'- '+k+'：'+v).join('\n')}\n\n## 配置与资源方案\n\n模型：${t.model||'示例模型 A'}\nTemperature：${t.temperature??'0.2'}\n外部依赖：${t.requirements.knowledge}\n\n## 待办\n\n- 配置真实模型服务并验证所需能力。\n- 连接目标 Dify，按实际版本生成完整 DSL。\n- 完成真实导入和运行验证。\n- 替换已标明的模拟依赖。\n\n## 版本\n\nv0.${t.version}\n`;}
function download(kind){const t=task();const content=kind==='yaml'?yamlText():kind==='tests'?`# ${t.name} · 模拟试跑报告\n\n所有结果仅为演示，实际导入和执行未验证。\n\n${testCases(t).map(x=>`## ${x[0]}\n输入：${x[1]}\n预期：${x[2]}\n演示结果：${x[3]}\n状态：模拟通过\n`).join('\n')}`:reportText(t);const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));a.href=url;a.download=`${t.name}-${kind==='yaml'?'示意不可导入.yaml':kind==='tests'?'模拟试跑.md':'需求与配置.md'}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载演示文件，真实导入和执行仍待验证');}
function previewDsl(){showModal('示意 DSL','用于展示成果查看体验，不可直接导入 Dify。',`<div class="callout amber" style="margin-bottom:14px">这是说明性 YAML，不是经过验证的 Dify DSL。</div><pre class="code">${esc(yamlText())}</pre>`,`<button class="secondary" data-download="yaml">${icon('download',true)}下载示意文件</button><button class="primary" data-action="close">关闭</button>`,true);}
function restore(v){const t=task(),old=t.versions.find(x=>x.v===Number(v));if(!old)return;if(t.status==='running')pauseRun();if(old.snapshot)t.requirements=JSON.parse(JSON.stringify(old.snapshot));t.version=Math.max(t.version,...t.versions.map(x=>x.v))+1;t.req=false;t.cfg=false;t.status='draft';t.runStep=0;activeTab='requirements';addMessage('assistant',`已把 v0.${v} 的需求恢复为新草稿 v0.${t.version}，历史记录仍保留。请重新确认需求、配置并试跑。`);toast('已恢复为新草稿，需要重新确认');}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(e.target.id==='overlay'){closeModal();return;}if(!el)return;if(el.dataset.task){if(task().status==='running')pauseRun();store.active=el.dataset.task;activeTab=task().status==='complete'?'delivery':task().req?'config':'requirements';save();render();return;}if(el.dataset.tab){activeTab=el.dataset.tab;renderPanel();document.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('active',x.dataset.tab===activeTab);x.setAttribute('aria-selected',x.dataset.tab===activeTab);});return;}if(el.dataset.suggest){$('#messageInput').value=el.dataset.suggest;$('#messageInput').focus();return;}if(el.dataset.type){selectedType=el.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('selected',x.dataset.type===selectedType));return;}if(el.dataset.setting){settings(el.dataset.setting);return;}if(el.dataset.provider){providerForm(el.dataset.provider);return;}if(el.dataset.env){envForm(el.dataset.env);return;}if(el.dataset.deleteProvider){store.providers=store.providers.filter(x=>x.id!==el.dataset.deleteProvider);save();render();settings('models');return;}if(el.dataset.download){download(el.dataset.download);return;}if(el.dataset.restore){restore(el.dataset.restore);return;}if(el.dataset.node){chosenNode=el.dataset.node;document.querySelectorAll('.graph-node').forEach(x=>x.classList.toggle('selected',x.dataset.node===chosenNode));$('#nodeDetail').textContent='节点说明：'+el.dataset.description+'。实际配置需经目标环境验证。';return;}if(el.dataset.removeFile!==undefined){task().files.splice(Number(el.dataset.removeFile),1);save();renderFiles();return;}const act=el.dataset.action;const views={viewreq:'requirements',viewconfig:'config',viewrun:'run',viewdelivery:'delivery'};if(views[act]){activeTab=views[act];render();return;}const actions={new:newModal,createtask:createTask,close:closeModal,send,models:()=>settings('models'),env:()=>settings('env'),usage:()=>settings('usage'),editreq:editReq,savereq:saveReq,confirmreq:()=>{if(Object.values(task().requirements).some(v=>v==='待补充'||!v))return toast('请先编辑说明单，补齐关键需求');confirmReq();},confirmconfig:confirmConfig,run:startRun,pause:pauseRun,graph:graphModal,editconfig:editConfig,saveconfig:saveConfig,addprovider:()=>providerForm(),saveprovider:saveProvider,testprovider:testProvider,addenv:()=>envForm(),saveenv:saveEnv,testenv:()=>{$('#eTest').innerHTML='<div class="callout">模拟检查完成。真实连接与版本仍未验证，没有访问该地址。</div>';},savelimits:()=>{const retries=Number($('#limitRetries').value),minutes=Number($('#limitMinutes').value);if(!Number.isInteger(retries)||retries<1||!Number.isFinite(minutes)||minutes<1)return toast('请输入大于零的有效上限');store.limits={retries,minutes};save();toast('演示上限已保存；正式版由执行器落实');},previewdsl:previewDsl,upload:()=>$('#fileInput').click(),reset:()=>{showModal('重置原型数据','只清除这个原型保存的演示任务和设置。','<p style="font-size:12px;color:#80899c">重置后将恢复最初的三个示例任务。此操作不会影响 Dify 或其他应用。</p>','<button class="secondary" data-action="usage">取消</button><button class="danger" data-action="doreset">确认重置</button>');},doreset:()=>{clearTimeout(timer);try{localStorage.removeItem(STORAGE);}catch(e){}location.reload();}};actions[act]?.();});
$('#fileInput').addEventListener('change',e=>{const files=Array.from(e.target.files);if(!files.length)return;files.forEach(f=>task().files.push({name:f.name,size:f.size,type:f.type}));invalidate();task().messages.push({role:'assistant',text:`已登记参考文件：${files.map(f=>f.name).join('、')}。\n\n本原型只保存文件名称，不读取内容或上传。正式版会解析材料，并确认参考程度、冲突与资源需求。请在说明单中补充本轮要求后重新确认。`});save();render();e.target.value='';toast('附件名称已登记；原型未解析或上传文件');});
$('#messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('#overlay')){const focusable=[...$('#overlay').querySelectorAll('button,input:not([type=hidden]),select,textarea')].filter(x=>!x.disabled);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
const originalRenderPanel=renderPanel;
renderPanel=function(){originalRenderPanel();if(activeTab==='requirements'){const ready=2+Object.values(task().requirements).filter(v=>v&&!/^待补充/.test(v)).length;const count=$('#panel .card strong[style]');if(count)count.textContent=`${ready} / 8`;const bar=$('#panel .progress-fill');if(bar)bar.style.width=`${ready/8*100}%`;const note=$('#panel .subtext');if(note&&ready<8)note.textContent='关键需求尚未齐全。请通过对话或编辑说明单补充，确认前不会开始搭建。';}}
window.addEventListener('beforeunload',()=>{if(task().status==='running')task().status='paused';save();});
save();render();
</script>
</body></html>
