app:
  description: 由 Sierra 工作流计划生成，目标 Dify 1.17.1。静态验证通过前不会导入。
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: Sierra售后改文案验收
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: knowledge-retrieval
      id: start-source-retrieve
      source: start
      sourceHandle: source
      target: retrieve
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: knowledge-retrieval
        targetType: if-else
      id: retrieve-source-check_hit
      source: retrieve
      sourceHandle: source
      target: check_hit
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: if-else
        targetType: llm
      id: check_hit-case1-answer_llm
      source: check_hit
      sourceHandle: case1
      target: answer_llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: if-else
        targetType: template-transform
      id: check_hit-false-answer_miss
      source: check_hit
      sourceHandle: 'false'
      target: answer_miss
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: llm
        targetType: end
      id: answer_llm-source-answer_hit
      source: answer_llm
      sourceHandle: source
      target: answer_hit
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: template-transform
        targetType: end
      id: answer_miss-source-end_miss
      source: answer_miss
      sourceHandle: source
      target: end_miss
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - variable: query
          label: 问题
          type: paragraph
          required: true
          max_length: null
          options: []
          hide: false
      height: 100
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 检索售后FAQ
        type: knowledge-retrieval
        query_variable_selector:
        - start
        - query
        query_attachment_selector: []
        dataset_ids:
        - d12cf081-5c52-41e3-b869-e94e6f8d37b1
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 3
          score_threshold: null
          reranking_enable: false
        metadata_filtering_mode: disabled
        vision:
          enabled: false
      height: 100
      id: retrieve
      position:
        x: 380
        y: 282
      positionAbsolute:
        x: 380
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 是否有检索命中
        type: if-else
        _targetBranches:
        - id: case1
          name: IF
        - id: 'false'
          name: ELSE
        cases:
        - case_id: case1
          logical_operator: and
          conditions:
          - id: condition_0_0
            varType: array[object]
            variable_selector:
            - retrieve
            - result
            comparison_operator: not empty
            value: ''
      height: 100
      id: check_hit
      position:
        x: 680
        y: 282
      positionAbsolute:
        x: 680
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 依据FAQ回答
        type: llm
        model:
          provider: langgenius/deepseek/deepseek
          name: deepseek-flash
          mode: chat
          completion_params:
            temperature: 0.2
            max_tokens: 512
            thinking: false
        prompt_template:
        - role: system
          text: '你是虚构蓝杉商店的售后知识问答助手，本演示不接入任何真实商家服务。

            只依据给定的检索上下文回答，不得编造政策、编号、天数或审批结果。

            规则：

            1. 回答必须引用命中的政策编号（例如 ZXRET715、ZXWAR180）。

            2. 若检索资料未覆盖用户问题，或被拆封、人为损坏等条件无法判断，明确说明资料不足并建议转人工，不得推断结论。

            3. 使用简体中文，简明作答。'
        - role: user
          text: '用户问题：{{#start.query#}}


            检索上下文：

            {{#context#}}'
        context:
          enabled: true
          variable_selector:
          - retrieve
          - result
        vision:
          enabled: false
        variables: []
      height: 100
      id: answer_llm
      position:
        x: 980
        y: 282
      positionAbsolute:
        x: 980
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 命中输出
        type: end
        outputs:
        - variable: result
          value_selector:
          - answer_llm
          - text
      height: 100
      id: answer_hit
      position:
        x: 1280
        y: 282
      positionAbsolute:
        x: 1280
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 无命中固定提示
        type: template-transform
        template: 知识库暂无相关信息，请联系人工客服并提供订单号。
        variables: []
      height: 100
      id: answer_miss
      position:
        x: 1580
        y: 282
      positionAbsolute:
        x: 1580
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 无命中输出
        type: end
        outputs:
        - variable: result
          value_selector:
          - answer_miss
          - output
      height: 100
      id: end_miss
      position:
        x: 1880
        y: 282
      positionAbsolute:
        x: 1880
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
  rag_pipeline_variables: []
