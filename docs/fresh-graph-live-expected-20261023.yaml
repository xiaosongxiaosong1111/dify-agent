app:
  description: 由 Sierra 工作流计划生成，目标 Dify 1.17.1。静态验证通过前不会导入。
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: Sierra新需求图平台验收
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: knowledge-retrieval
      id: start-source-retrieve
      source: start
      sourceHandle: source
      target: retrieve
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: knowledge-retrieval
        targetType: if-else
      id: retrieve-source-check_hits
      source: retrieve
      sourceHandle: source
      target: check_hits
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: if-else
        targetType: llm
      id: check_hits-case1-answer_llm
      source: check_hits
      sourceHandle: case1
      target: answer_llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: if-else
        targetType: template-transform
      id: check_hits-false-no_hit_text
      source: check_hits
      sourceHandle: 'false'
      target: no_hit_text
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: llm
        targetType: end
      id: answer_llm-source-hit_end
      source: answer_llm
      sourceHandle: source
      target: hit_end
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: template-transform
        targetType: end
      id: no_hit_text-source-no_hit_end
      source: no_hit_text
      sourceHandle: source
      target: no_hit_end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - variable: query
          label: query
          type: text-input
          required: true
          max_length: 50000
          options: []
      height: 100
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 检索售后政策
        type: knowledge-retrieval
        query_variable_selector:
        - start
        - query
        query_attachment_selector: []
        dataset_ids:
        - d12cf081-5c52-41e3-b869-e94e6f8d37b1
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 3
          score_threshold: null
          reranking_enable: false
        metadata_filtering_mode: disabled
        vision:
          enabled: false
      height: 100
      id: retrieve
      position:
        x: 380
        y: 282
      positionAbsolute:
        x: 380
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 是否有检索结果
        type: if-else
        _targetBranches:
        - id: case1
          name: IF
        - id: 'false'
          name: ELSE
        cases:
        - case_id: case1
          logical_operator: and
          conditions:
          - id: condition_0_0
            varType: array[object]
            variable_selector:
            - retrieve
            - result
            comparison_operator: not empty
            value: ''
      height: 100
      id: check_hits
      position:
        x: 680
        y: 282
      positionAbsolute:
        x: 680
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 依据资料回答
        type: llm
        model:
          provider: langgenius/deepseek/deepseek
          name: deepseek-flash
          mode: chat
          completion_params:
            temperature: 0.2
            max_tokens: 512
            thinking: false
        prompt_template:
        - role: system
          text: '你是蓝杉商店售后政策问答助手。只能依据提供的检索资料回答，不得编造资料中没有的政策内容；回答中必须给出所依据的政策编号（如 ZXRET715、ZXWAR180）。若资料不足以回答该问题，只回复：知识库暂无相关信息，请联系人工客服并提供订单号。


            检索资料：

            {{#context#}}'
        - role: user
          text: '{{#start.query#}}'
        context:
          enabled: true
          variable_selector:
          - retrieve
          - result
        vision:
          enabled: false
        variables: []
      height: 100
      id: answer_llm
      position:
        x: 980
        y: 282
      positionAbsolute:
        x: 980
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 无命中输出
        type: end
        outputs:
        - variable: result
          value_selector:
          - no_hit_text
          - output
      height: 100
      id: no_hit_end
      position:
        x: 1280
        y: 282
      positionAbsolute:
        x: 1280
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 固定无命中回复
        type: template-transform
        template: 知识库暂无相关信息，请联系人工客服并提供订单号。
        variables: []
      height: 100
      id: no_hit_text
      position:
        x: 1580
        y: 282
      positionAbsolute:
        x: 1580
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 命中输出
        type: end
        outputs:
        - variable: result
          value_selector:
          - answer_llm
          - text
      height: 100
      id: hit_end
      position:
        x: 1880
        y: 282
      positionAbsolute:
        x: 1880
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
  rag_pipeline_variables: []
